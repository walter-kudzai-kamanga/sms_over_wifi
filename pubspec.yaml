name: sms_over_wifi
description: A Flutter package to send SMS messages over Wi-Fi without a SIM card
version: 2.0.0
homepage: https://github.com/walter-kudzai-kamanga/sms_over_wifi
repository: https://github.com/walter-kudzai-kamanga/sms_over_wifi.git
issue_tracker: https://github.com/walter-kudzai-kamanga/sms_over_wifi/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  dio: ^5.0.0
  mailer: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
 